<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hard Boiled</title>
<style>
  :root { --bg: #1b1916; --fg: #e5dfd0; --dim: #8d8577; --acc: #6aa6db; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, monospace; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  canvas#out { width: min(96vw, 1400px); height: auto; background: #000; display: block; }
  canvas#gl { position: absolute; left: -99999px; top: 0; }
  #bar { display: flex; gap: 10px; align-items: center; width: min(96vw, 1400px); }
  #scrub { flex: 1; accent-color: var(--acc); }
  button, select { background: #2a2622; color: var(--fg); border: 1px solid #4b4845; border-radius: 6px; padding: 5px 10px; font: inherit; }
  #info { color: var(--dim); min-width: 280px; text-align: right; }
  body.capture #bar, body.capture #help { display: none; }
  #help { color: var(--dim); }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="wrap">
  <canvas id="out" width="1920" height="1080"></canvas>
  <div id="bar">
    <button id="play">▶ play</button>
    <input id="scrub" type="range" min="0" max="40" step="0.0333" value="0" />
    <select id="jump"></select>
    <span id="info">loading…</span>
  </div>
  <div id="help">space play/pause · ←/→ 1 frame · shift+←/→ 1 s · [ / ] prev/next shot · ?t=12.3 or ?shot=A1 · &port = 9:16</div>
</div>
<canvas id="gl" width="1920" height="1080"></canvas>
<audio id="song" src="data/mix.wav" preload="auto"></audio>
<script type="module">
  const q = new URLSearchParams(location.search);
  import(q.has('lab') ? './src/lab.js' : './src/main.js');
</script>
</body>
</html>
